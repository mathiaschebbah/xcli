name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync deps
        run: uv sync

      - name: Smoke test — import & CLI loads
        run: |
          uv run python -c "import xa; print('xa', xa.__version__)"
          uv run xa --help > /dev/null
          uv run xa help > /dev/null
          uv run xa ops --filter Search > /dev/null
          uv run xa cookies x.com > /dev/null || true   # OK si pas de Chrome en CI

      - name: Check no syntax errors
        run: |
          uv run python -m compileall -q src/
