name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync deps
        run: uv sync

      - name: Smoke test — import & CLI loads
        run: |
          uv run python -c "import xa; print('xa', xa.__version__)"
          uv run xa --help > /dev/null
          uv run xa help > /dev/null
          uv run xa help search > /dev/null       # introspection per-command
          uv run xa help post > /dev/null         # write command schema
          uv run xa help raw > /dev/null          # raw escape hatch
          uv run xa ops --filter Search > /dev/null
          uv run xa cookies x.com > /dev/null || true   # OK si pas de Chrome en CI

      - name: Smoke test — write lock works without --yes
        run: |
          out=$(uv run xa post "ci-test" 2>&1)
          echo "$out" | grep -q "confirmation_required" || (echo "FAIL: write lock broken" && exit 1)

      - name: Check no syntax errors
        run: |
          uv run python -m compileall -q src/
